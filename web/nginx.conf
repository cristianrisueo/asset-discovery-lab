# web (spec §14.3): serves the Vite build and proxies /api/ to the explorer.
# Replaces the image's /etc/nginx/nginx.conf.
user nginx;
# Two workers keep the container well inside its 64 MiB limit (spec §15.4).
worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json;

  # Structured JSON access log with a service field (CLAUDE.md).
  log_format json escape=json '{"time":"$time_iso8601","level":"info","service":"web",'
    '"msg":"request","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time_s":$request_time,'
    '"upstream_time_s":"$upstream_response_time"}';
  access_log /dev/stdout json;

  # Docker's DNS, re-resolved every 10 s, so a restarted explorer with a new
  # address is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    # localhost resolves to ::1 first in Alpine, and the §15.6 health check
    # uses http://localhost/.
    listen [::]:80;
    root /usr/share/nginx/html;

    location /api/ {
      # A variable makes nginx resolve at request time. Without a URI part,
      # the original request URI is passed unchanged.
      set $explorer http://explorer:8080;
      proxy_pass $explorer;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Client routes fall back to index.html.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}

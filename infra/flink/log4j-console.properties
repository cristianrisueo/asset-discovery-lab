# Log4j configuration of the Flink JobManager and TaskManager containers.
# It is the image's default, with the console appender switched to JSON lines
# that carry a service field (docs/development/CLAUDE.build.md, spec §17.2). ADL_SERVICE comes from compose.

monitorInterval=30

rootLogger.level = ${env:ROOT_LOG_LEVEL:-INFO}
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

logger.pekko.name = org.apache.pekko
logger.pekko.level = INFO
logger.kafka.name= org.apache.kafka
logger.kafka.level = INFO
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = INFO
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = INFO
logger.shaded_zookeeper.name = org.apache.flink.shaded.zookeeper3
logger.shaded_zookeeper.level = INFO

# Console: JSON lines.
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = JsonTemplateLayout
appender.console.layout.eventTemplateUri = classpath:JsonLayout.json
appender.console.layout.service.type = EventTemplateAdditionalField
appender.console.layout.service.key = service
appender.console.layout.service.value = ${env:ADL_SERVICE:-flink}
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = ${sys:console.log.level:-ALL}

# Rolling file, read by the Flink UI: the image's plain layout.
appender.rolling.name = RollingFileAppender
appender.rolling.type = RollingFile
appender.rolling.append = true
appender.rolling.fileName = ${sys:log.file}
appender.rolling.filePattern = ${sys:log.file}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=100MB
appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = ${env:MAX_LOG_FILE_NUMBER:-10}

# The four chained Doris committers register the same 'pendingCommittables'
# metric, and Flink warns about the collision on every checkpoint. The metric
# is only dropped from reporting; keep the log readable (decision D-034).
logger.metriccollision.name = org.apache.flink.metrics.MetricGroup
logger.metriccollision.level = ERROR

logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = OFF

# asset-discovery-lab local stack (spec §15).
# The file grows sprint by sprint: it only contains services that are already
# built, each in its final profile (spec §15.2, sprints plan §3.6).
name: adl

services:
  # --- Kafka (spec §8) -------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    profiles: [core]
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      # Fixed and committed (spec §8.1); generated once with kafka-storage.sh random-uuid.
      CLUSTER_ID: 97agkXLTQ7GFSS3sN2JpZA
    ports:
      - "29092:29092"
    volumes:
      # The image owns /var/lib/kafka/data as appuser, so the volume inherits it (spec §15.7).
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 60s
      interval: 5s
      timeout: 20s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1024M
    networks: [adl]

  kafka-init:
    image: apache/kafka:4.3.2
    profiles: [core]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:9092
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./infra/scripts/create-topics.sh:/opt/adl/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/adl/create-topics.sh"]
    networks: [adl]

  # --- Dragonfly (cache, spec §9.3) -----------------------------------------
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v2.1.0
    profiles: [core]
    restart: unless-stopped
    command: ["dragonfly", "--logtostderr", "--proactor_threads=1", "--maxmemory=256mb", "--cache_mode=true", "--version_check=false"]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [adl]

  # --- datacore (spec §7) ----------------------------------------------------
  datacore:
    build:
      context: .
      dockerfile: datacore/Dockerfile
    image: adl/datacore:0.1.0
    profiles: [core]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      GOMEMLIMIT: 128MiB
      KAFKA_BROKERS: kafka:9092
      DB_PATH: /data/datacore.db
    ports:
      - "50051:50051"
      - "8090:8090"
    volumes:
      # The image creates /data owned by the distroless nonroot user (spec §15.7).
      - datacore-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/datacore", "healthcheck"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [adl]

  # --- adapter (spec §9) -----------------------------------------------------
  adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: adl/adapter:0.1.0
    profiles: [core]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datacore:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 128MiB
      KAFKA_BROKERS: kafka:9092
      DATACORE_ADDR: datacore:50051
      DRAGONFLY_ADDR: dragonfly:6379
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "/usr/local/bin/adapter", "healthcheck"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [adl]

volumes:
  kafka-data:
  datacore-data:

networks:
  adl:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1

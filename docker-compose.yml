# asset-discovery-lab local stack (spec §15).
# The file grows sprint by sprint: it only contains services that are already
# built, each in its final profile (spec §15.2, sprints plan §3.6).
name: adl

# Flink cluster configuration (spec §10.9), shared by the JobManager and the
# TaskManager through FLINK_PROPERTIES. Every key is a Flink 2.1 key (spec §3 R17).
x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  rest.address: flink-jobmanager
  taskmanager.numberOfTaskSlots: 2
  parallelism.default: 2
  jobmanager.memory.process.size: 1152m
  jobmanager.memory.jvm-metaspace.size: 384m
  taskmanager.memory.process.size: 1792m
  taskmanager.memory.managed.fraction: 0.1
  taskmanager.memory.jvm-metaspace.size: 384m
  state.backend.type: hashmap
  execution.checkpointing.interval: 10s
  execution.checkpointing.mode: EXACTLY_ONCE
  execution.checkpointing.timeout: 2min
  execution.checkpointing.min-pause: 2s
  execution.checkpointing.max-concurrent-checkpoints: 1
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  execution.checkpointing.num-retained: 3
  execution.checkpointing.dir: file:///flink-data/checkpoints
  execution.checkpointing.savepoint-dir: file:///flink-data/savepoints
  restart-strategy.type: exponential-delay
  heartbeat.interval: 3000
  heartbeat.timeout: 15000
  rest.server.max-content-length: 536870912

services:
  # --- Kafka (spec §8) -------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    profiles: [core]
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      # Fixed and committed (spec §8.1); generated once with kafka-storage.sh random-uuid.
      CLUSTER_ID: 97agkXLTQ7GFSS3sN2JpZA
    ports:
      - "29092:29092"
    volumes:
      # The image owns /var/lib/kafka/data as appuser, so the volume inherits it (spec §15.7).
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 60s
      interval: 5s
      timeout: 20s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1024M
    networks: [adl]

  kafka-init:
    image: apache/kafka:4.3.2
    profiles: [core]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:9092
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./infra/scripts/create-topics.sh:/opt/adl/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/adl/create-topics.sh"]
    networks: [adl]

  # --- Dragonfly (cache, spec §9.3) -----------------------------------------
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v2.1.0
    profiles: [core]
    restart: unless-stopped
    command: ["dragonfly", "--logtostderr", "--proactor_threads=1", "--maxmemory=256mb", "--cache_mode=true", "--version_check=false"]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [adl]

  # --- datacore (spec §7) ----------------------------------------------------
  datacore:
    build:
      context: .
      dockerfile: datacore/Dockerfile
    image: adl/datacore:0.1.0
    profiles: [core]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      GOMEMLIMIT: 128MiB
      KAFKA_BROKERS: kafka:9092
      DB_PATH: /data/datacore.db
    ports:
      - "50051:50051"
      - "8090:8090"
    volumes:
      # The image creates /data owned by the distroless nonroot user (spec §15.7).
      - datacore-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/datacore", "healthcheck"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [adl]

  # --- adapter (spec §9) -----------------------------------------------------
  adapter:
    build:
      context: .
      dockerfile: adapter/Dockerfile
    image: adl/adapter:0.1.0
    profiles: [core]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datacore:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 128MiB
      KAFKA_BROKERS: kafka:9092
      DATACORE_ADDR: datacore:50051
      DRAGONFLY_ADDR: dragonfly:6379
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "/usr/local/bin/adapter", "healthcheck"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [adl]

  # --- Doris (spec §11) ------------------------------------------------------
  doris-fe:
    build:
      context: ./infra/doris
      dockerfile: fe.Dockerfile
    image: adl/doris-fe:0.1.0
    profiles: [core]
    hostname: doris-fe
    restart: unless-stopped
    environment:
      # Election mode of the 4.1.5 entrypoint (spec §3 R2, §11.1).
      FE_SERVERS: fe1:172.30.0.2:9010
      FE_ID: "1"
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/bootstrap | grep -q '\"code\":0'"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1792M
    networks:
      adl:
        ipv4_address: 172.30.0.2

  doris-be:
    build:
      context: ./infra/doris
      dockerfile: be.Dockerfile
    image: adl/doris-be:0.1.0
    profiles: [core]
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      FE_SERVERS: fe1:172.30.0.2:9010
      BE_ADDR: 172.30.0.3:9050
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8040/api/health > /dev/null"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 3328M
    networks:
      adl:
        ipv4_address: 172.30.0.3

  doris-init:
    image: mysql:8.4.13
    profiles: [core]
    restart: "no"
    depends_on:
      doris-be:
        condition: service_healthy
    environment:
      DORIS_HOST: doris-fe
      DORIS_EXPLORER_PASSWORD: ${DORIS_EXPLORER_PASSWORD}
    volumes:
      - ./infra/scripts/doris-init.sh:/opt/adl/doris-init.sh:ro
      - ./infra/doris/init-core.sql:/opt/adl/init-core.sql:ro
    entrypoint: ["bash", "/opt/adl/doris-init.sh", "/opt/adl/init-core.sql"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [adl]

  # --- Flink (spec §10) ------------------------------------------------------
  flink-jobmanager:
    build:
      context: ./infra/flink
    image: adl/flink:0.1.0
    profiles: [core]
    hostname: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment:
      ADL_SERVICE: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    ports:
      - "8081:8081"
    volumes:
      - flink-data:/flink-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      start_period: 90s
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1280M
    networks: [adl]

  flink-taskmanager:
    build:
      context: ./infra/flink
    image: adl/flink:0.1.0
    profiles: [core]
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      ADL_SERVICE: flink-taskmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-data:/flink-data
    # No health check: the submitter waits until the JobManager reports free slots (spec §15.6).
    deploy:
      resources:
        limits:
          memory: 2048M
    networks: [adl]

  flink-job:
    build:
      context: ./processor
    image: adl/processor:0.1.0
    profiles: [core]
    restart: "no"
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      doris-init:
        condition: service_completed_successfully
      # Lake dependencies are optional, so make up-core starts without them (spec §15.2).
      iceberg-rest:
        condition: service_healthy
        required: false
      rustfs-init:
        condition: service_completed_successfully
        required: false
    environment:
      FLINK_REST: http://flink-jobmanager:8081
      # make up-core exports ICEBERG_ENABLED=false (spec §15.2).
      ICEBERG_ENABLED: ${ICEBERG_ENABLED:-true}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - flink-data:/flink-data
      - ./infra/flink/submit-job.sh:/opt/adl/submit-job.sh:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [adl]

  # --- Lake (spec §12) -------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: [lake]
    hostname: rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # The image owns /data as rustfs (uid 10001), so the volume inherits it (spec §15.7).
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health > /dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [adl]

  rustfs-init:
    image: amazon/aws-cli:2.42.4
    profiles: [lake]
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://rustfs:9000
      BUCKET: warehouse
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./infra/scripts/create-bucket.sh:/opt/adl/create-bucket.sh:ro
    entrypoint: ["bash", "/opt/adl/create-bucket.sh"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [adl]

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    profiles: [lake]
    hostname: iceberg-rest
    restart: unless-stopped
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      # The fixture maps CATALOG_X_Y__Z to the property x.y-z (spec §12.2).
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION:-us-east-1}
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - "8181:8181"
    volumes:
      # The catalog's SQLite file is /tmp/iceberg_catalog.db (spec §3 R8).
      - iceberg-rest-data:/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config > /dev/null"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [adl]

  doris-init-lake:
    image: mysql:8.4.13
    profiles: [lake]
    restart: "no"
    depends_on:
      doris-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
    environment:
      ADL_SERVICE: doris-init-lake
      DORIS_HOST: doris-fe
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./infra/scripts/doris-init.sh:/opt/adl/doris-init.sh:ro
      - ./infra/doris/init-lake.sql:/opt/adl/init-lake.sql:ro
    entrypoint: ["bash", "/opt/adl/doris-init.sh", "/opt/adl/init-lake.sql"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [adl]

volumes:
  kafka-data:
  datacore-data:
  doris-fe-meta:
  doris-be-storage:
  flink-data:
  rustfs-data:
  iceberg-rest-data:

networks:
  adl:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1
